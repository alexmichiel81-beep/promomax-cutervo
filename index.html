<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROMOMAX CUTERVO</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8e8;color:#17352a}
header{padding:25px 6%;color:#fff;background:linear-gradient(135deg,#064b31,#12a96b,#f3b51b);box-shadow:0 5px 20px #0003}
.logo{font-size:34px;font-weight:900}.logo span{color:#ffe16a}.sub{margin:5px 0 0}
.hero{text-align:center;padding:55px 6%;background:linear-gradient(135deg,#fff8df,#eafff2)}
.hero h1{font-size:clamp(42px,8vw,76px);margin:0;color:#087448;text-shadow:3px 3px #ffd34f}
.hero p{font-size:19px;max-width:850px;margin:15px auto;line-height:1.6}
.buttons{max-width:1200px;margin:25px auto;padding:0 5%;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
button{border:0;padding:18px 12px;border-radius:22px;font-weight:900;font-size:16px;background:#fff;color:#075b3a;box-shadow:0 7px 20px #0002;cursor:pointer;transition:.2s}
button:hover,button.active{transform:scale(1.04);background:linear-gradient(135deg,#075b3a,#16a96b);color:white}
main{max-width:1200px;margin:auto;padding:15px 5% 60px}.panel{background:#fff;border-radius:32px;padding:30px;box-shadow:0 12px 35px #0002}
h2{font-size:36px;color:#087448;margin:0}.intro{font-size:17px;line-height:1.7}
.count{display:inline-block;background:#ffd34f;border-radius:30px;padding:8px 15px;font-weight:bold;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{padding:21px;border-radius:23px;background:linear-gradient(145deg,#fffdf4,#edfff5);border:2px solid #e7f1e9;box-shadow:0 8px 20px #0001;transition:.2s}
.card:hover{transform:translateY(-7px);border-color:#f2bd35;box-shadow:0 14px 28px #0b8d5930}.num{font-size:28px;font-weight:900;color:#e29d00}.card h3{color:#075b3a;margin:7px 0;font-size:20px}.card p{line-height:1.5;margin:0}.tag{display:inline-block;margin-top:12px;background:#0b8d59;color:#fff;border-radius:20px;padding:6px 11px;font-size:12px;font-weight:bold}
footer{background:#063d2a;color:#fff;text-align:center;padding:28px}
</style>
</head>
<body>
<header><div class="logo">PROMOMAX <span>CUTERVO</span></div><p class="sub">✨ Descubre • Visita • Disfruta • Promociona ✨</p></header>
<section class="hero"><h1>¡CUTERVO TE ESPERA!</h1><p>Una página para descubrir y promocionar los atractivos, negocios, instituciones, cultura y naturaleza de nuestra provincia.</p></section>
<nav class="buttons">
<button class="active" onclick="show('turismo',this)">🏞️ Turismo</button>
<button onclick="show('comida',this)">🍲 Comida</button>
<button onclick="show('educacion',this)">📚 Educación</button>
<button onclick="show('cultura',this)">🎭 Cultura</button>
<button onclick="show('naturaleza',this)">🌿 Naturaleza</button>
<button onclick="show('comercio',this)">🛍️ Comercio</button>
</nav>
<main><section class="panel" id="panel"></section></main>
<footer><b>PROMOMAX CUTERVO</b><br>Promocionando lo mejor de nuestra provincia.</footer>

["Hoteles y hospedajes","Servicios necesarios para recibir a visitantes.","Turismo"],
["Tiendas locales","Comercios que ofrecen productos y servicios a la población.","Comercio"],
["Ferias comerciales","Espacios para promocionar productos y emprendimientos.","Feria"],
["Emprendimientos juveniles","Ideas de negocio desarrolladas por jóvenes de Cutervo.","Emprendimiento"],
["Productos agrícolas locales","Productos cultivados y comercializados en la provincia.","Agricultura"]]]
};
function show(k,b){
document.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
let d=data[k];
document.getElementById("panel").innerHTML=`<h2>${d[0]}</h2><p class="intro">${d[1]}</p><span class="count">${d[2].length} lugares y propuestas para promocionar</span><div class="grid">${d[2].map((x,i)=>`<article class="card"><div class="num">${String(i+1).padStart(2,"0")}</div><h3>${x[0]}</h3><p>${x[1]}</p><span class="tag">${x[2]}</span></article>`).join("")}</div>`;
}
show("turismo",document.querySelector("button.active"));
</script>
</body>
</html>
